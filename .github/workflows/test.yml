name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        # pyobjc and pywebview are darwin-only (platform markers in
        # requirements.txt) so pip silently skips them on Linux.
        run: pip install -r requirements.txt pytest pytest-asyncio httpx anyio

      - name: Run pytest
        run: python -m pytest tests/ --ignore=tests/js -v --tb=short

  js-tests:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Vitest
        run: npm test
